<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POS preview</title><script src="assets/vendor/lucide.min.js"></script><body style="margin:0"><style>
#espresso-preview .app{--c-bg:#f5efe6;--c-panel:#fffcf8;--c-text:#291e18;--c-muted:#756458;--c-line:#ddd0c2;--c-main:#4b2e23;--c-soft:#ead8c3;color:var(--c-text);background:var(--c-bg);font:14px 'Segoe UI',sans-serif;border:1px solid var(--c-line);border-radius:8px;overflow:hidden;min-height:680px;color-scheme:light}
#espresso-preview .app button,#espresso-preview .app input,#espresso-preview .app select{font:inherit;border:1px solid var(--c-line);border-radius:5px;padding:9px 12px;background:var(--c-panel);color:var(--c-text)}
#espresso-preview .app button{cursor:default}#espresso-preview .app button:hover{background:var(--c-soft)}#espresso-preview .app .primary,#espresso-preview .app button.selected{background:var(--c-main);color:#fff;border-color:var(--c-main)}
#espresso-preview .chrome{padding:12px 18px;background:var(--c-panel);border-bottom:1px solid var(--c-line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#espresso-preview .brand{font-weight:600}#espresso-preview .caption{font-size:12px;color:var(--c-muted)}
#espresso-preview .workspace{display:grid;grid-template-columns:155px minmax(0,1fr);min-height:625px}#espresso-preview .sidebar{background:var(--c-panel);border-right:1px solid var(--c-line);padding:16px 10px;display:flex;flex-direction:column;gap:8px}#espresso-preview .sidebar button{text-align:left;border-color:transparent}#espresso-preview .sidebar .caption{padding:12px 8px}
#espresso-preview .content{padding:18px;min-width:0}#espresso-preview h2{font:600 20px 'Segoe UI',sans-serif;margin:0 0 6px}#espresso-preview h3{font:600 15px 'Segoe UI',sans-serif;margin:0}#espresso-preview .heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}#espresso-preview .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#espresso-preview .pos{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}#espresso-preview .panel{background:var(--c-panel);border:1px solid var(--c-line);border-radius:6px;padding:14px}#espresso-preview .tables{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}#espresso-preview .menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}#espresso-preview .item{text-align:left;min-height:106px;display:flex;flex-direction:column;justify-content:space-between}#espresso-preview .item .price{color:var(--c-main);font-weight:600}#espresso-preview .item .category{font-size:12px;color:var(--c-muted)}#espresso-preview .search{width:100%;box-sizing:border-box;margin-top:12px}#espresso-preview .orderline{display:flex;justify-content:space-between;gap:8px;padding:14px 0;border-bottom:1px solid var(--c-line)}#espresso-preview .totals{margin-top:20px;display:grid;gap:10px}#espresso-preview .sum{display:flex;justify-content:space-between;gap:8px}#espresso-preview .big{font-size:22px;font-weight:600}#espresso-preview .checkout{width:100%;margin-top:16px}#espresso-preview .badge{display:inline-block;background:var(--c-soft);color:var(--c-main);padding:4px 8px;border-radius:4px;font-size:12px}#espresso-preview .feedback{min-height:20px;color:var(--c-main);margin-top:12px;font-size:12px}#espresso-preview table{width:100%;border-collapse:collapse;font-size:13px}#espresso-preview th,#espresso-preview td{padding:13px 8px;border-bottom:1px solid var(--c-line);text-align:left}#espresso-preview th{background:var(--c-soft);font-weight:600}#espresso-preview .right{text-align:right}#espresso-preview .tablewrap{overflow-x:auto;margin-top:16px}#espresso-preview .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}#espresso-preview .kit{display:grid;gap:16px}#espresso-preview .kit label{display:grid;gap:7px}#espresso-preview .samplefields{display:grid;grid-template-columns:1fr 1fr;gap:16px}#espresso-preview .notice{padding:12px;background:#fff5db;color:#735200;border:1px solid #dfc785;border-radius:5px}#espresso-preview .error{color:#b42318;font-size:12px}#espresso-preview .pay{margin-top:14px;background:var(--c-soft);padding:12px;border-radius:6px;display:grid;gap:10px}#espresso-preview [hidden]{display:none!important}
#espresso-preview .modern{--c-bg:#f2f5f4;--c-main:#246354;--c-soft:#e2efe9;--c-line:#d6e0db}#espresso-preview .modern .workspace{grid-template-columns:1fr}#espresso-preview .modern .sidebar{flex-direction:row;border-right:0;border-bottom:1px solid var(--c-line);padding:8px 18px;flex-wrap:wrap}#espresso-preview .modern .sidebar .caption{display:none}#espresso-preview .modern .pos{grid-template-columns:minmax(0,1fr) 310px}#espresso-preview .modern .item{border-radius:10px;min-height:114px}#espresso-preview .modern .menu{grid-template-columns:repeat(3,minmax(0,1fr))}
#espresso-preview .compact{--c-bg:#f4f5f7;--c-main:#355372;--c-soft:#e6edf5;--c-line:#d0d7df}#espresso-preview .compact .workspace{grid-template-columns:132px minmax(0,1fr)}#espresso-preview .compact .content{padding:12px}#espresso-preview .compact .app button{border-radius:2px}#espresso-preview .compact .menu{grid-template-columns:1fr;gap:0}#espresso-preview .compact .item{min-height:51px;border-radius:0;display:grid;grid-template-columns:1fr auto;align-items:center;border-width:0 0 1px}#espresso-preview .compact .item .category{display:none}#espresso-preview .compact .panel{border-radius:2px}#espresso-preview .compact th,#espresso-preview .compact td{padding:9px 8px}
@media(max-width:760px){#espresso-preview .workspace,#espresso-preview .compact .workspace{grid-template-columns:1fr}#espresso-preview .sidebar{flex-direction:row;border-right:0;border-bottom:1px solid var(--c-line);flex-wrap:wrap}#espresso-preview .sidebar .caption{display:none}#espresso-preview .pos,#espresso-preview .modern .pos{grid-template-columns:1fr}#espresso-preview .modern .menu{grid-template-columns:repeat(2,minmax(0,1fr))}#espresso-preview .samplefields{grid-template-columns:1fr}#espresso-preview .app{min-height:1150px}#espresso-preview .content{padding:12px}}

#espresso-preview .chrome{background:#241814;color:#fff5e9;border-bottom-color:#4b3329;padding-right:100px}
#espresso-preview .chrome .caption{color:#dbc5b2}
#espresso-preview .sidebar{background:#241814;border-right-color:#4b3329}
#espresso-preview .sidebar .caption{color:#c9b5a4}
#espresso-preview .sidebar button{background:transparent;color:#ecdfd2;display:flex;gap:9px;align-items:center}
#espresso-preview .sidebar button:hover{background:#39251c}
#espresso-preview .sidebar button.selected{background:#c58b52;color:#241814;border-color:#c58b52}
#espresso-preview .item{border-top:3px solid #c58b52}
#espresso-preview .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
#espresso-preview .swatches span{padding:14px 8px;border:1px solid #ddd0c2;border-radius:4px;font-size:12px}
#espresso-preview .iconset{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
#espresso-preview .iconset span{display:flex;align-items:center;gap:7px}
#espresso-preview button:disabled{opacity:.5}
@media(max-width:500px){#espresso-preview .swatches{grid-template-columns:repeat(2,1fr)}#espresso-preview .chrome{padding-right:18px}}
</style>
<div id="espresso-preview" aria-label="UI Espresso và caramel">
<section aria-label="Espresso và caramel"><div class="app warm" aria-label="Bản mẫu Espresso"></div></section>


</div>
<script>
(()=>{const root=document.getElementById('espresso-preview');const products=[['Cà phê sữa',30000,'Cà phê'],['Americano',35000,'Cà phê'],['Cappuccino',45000,'Cà phê'],['Trà đào',40000,'Trà'],['Matcha latte',45000,'Trà'],['Bánh croissant',35000,'Bánh']];const money=n=>n.toLocaleString('vi-VN')+' ₫';
root.querySelectorAll('.app').forEach(app=>{let total=95000;app.innerHTML=`<div class="chrome"><div><span class="brand">AMERICANO · COFFEE HOUSE</span><span class="caption"> &nbsp; Espresso / Caramel · Bản mẫu</span></div><div class="caption">Nguyễn Minh Phú · ADMIN &nbsp; — &nbsp; □ &nbsp; ×</div></div><div class="workspace"><nav class="sidebar" aria-label="Phân hệ"><span class="caption">KHÔNG GIAN LÀM VIỆC</span><button class="selected" data-view="pos"><i data-lucide="coffee" aria-hidden="true"></i> Bán hàng</button><button data-view="list"><i data-lucide="package" aria-hidden="true"></i> Sản phẩm</button><button data-view="kit"><i data-lucide="palette" aria-hidden="true"></i> UI & icon</button><span class="caption">Kho · Công nợ<br><br>Nhân sự · Báo cáo</span></nav><main class="content"><section data-screen="pos"><div class="heading"><div><h2>Bán hàng</h2><span class="caption">Tại quán · Khu vực tầng trệt</span></div><span class="badge">Bàn 03 · Đơn mở</span></div><div class="pos"><div><div class="row"><button class="selected">Tại quán</button><button data-note="Chế độ mang đi — bản thử bố cục">Mang đi</button><button data-note="Chế độ giao hàng — bản thử bố cục">Giao hàng</button></div><div class="tables"><button data-table="01">Bàn 01</button><button data-table="02">Bàn 02</button><button class="selected" data-table="03">Bàn 03</button><button data-table="04">Bàn 04</button></div><input class="search" aria-label="Tìm món" placeholder="Tìm tên món…"><div class="menu">${products.map((p,i)=>`<button class="item" data-product="${i}"><span>${p[0]}</span><span class="category">${p[2]}</span><span class="price">${money(p[1])} ＋</span></button>`).join('')}</div></div><aside class="panel"><div class="row" style="justify-content:space-between"><h3>Đơn bàn 03</h3><span class="caption">HD…001</span></div><button style="width:100%;margin-top:12px" data-note="Chọn khách hoặc thêm khách mới">Khách vãng lai · Chọn khách</button><div class="lines"><div class="orderline"><span>Cà phê sữa <span class="caption">× 2</span></span><span>60.000 ₫</span></div><div class="orderline"><span>Bánh croissant <span class="caption">× 1</span></span><span>35.000 ₫</span></div></div><div class="totals"><div class="sum"><span>Tiền món</span><span class="subtotal">95.000 ₫</span></div><div class="sum"><span>Giảm giá</span><span>0 ₫</span></div><button data-note="Xem chương trình ưu đãi / hạng khách">Chọn ưu đãi</button><div class="sum"><span>Phải trả</span><span class="big amount">95.000 ₫</span></div></div><button class="primary checkout">Thanh toán · F8</button><div class="pay" hidden><h3>Xác nhận thanh toán</h3><label>Phương thức <select><option>Tiền mặt</option><option>Chuyển khoản</option></select></label><span class="caption">Bản mô phỏng · Không ghi giao dịch</span><div class="row"><button class="primary confirm">Xác nhận</button><button class="cancel">Quay lại</button></div></div><div class="feedback" aria-live="polite"></div></aside></div></section><section data-screen="list" hidden><div class="heading"><div><h2>Sản phẩm</h2><span class="caption">Menu và giá bán</span></div><button class="primary" data-note="Mở editor sản phẩm theo UI Guide">＋ Thêm sản phẩm</button></div><div class="panel"><div class="filters"><input placeholder="Tìm sản phẩm…" aria-label="Tìm sản phẩm"><select aria-label="Danh mục"><option>Tất cả danh mục</option><option>Cà phê</option><option>Trà</option><option>Bánh</option></select><button data-note="Đã cập nhật danh sách minh họa">Lọc</button></div><div class="tablewrap"><table><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th class="right">Giá bán</th><th>Trạng thái</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p[0]}</td><td>${p[2]}</td><td class="right">${money(p[1])}</td><td><span class="badge">Đang bán</span></td></tr>`).join('')}</tbody></table></div><div class="row" style="justify-content:space-between;margin-top:16px"><span class="caption">6 sản phẩm · Trang 1</span><button data-note="Chọn dòng để chỉnh sửa">Sửa sản phẩm</button></div></div><div class="feedback" aria-live="polite"></div></section><section data-screen="kit" hidden><div class="heading"><div><h2>UI & icon dùng chung</h2><span class="caption">Nút · Trường nhập · Trạng thái · Xác nhận</span></div></div><div class="kit"><div class="panel"><h3>Espresso · Kem sữa · Caramel</h3><div class="swatches"><span style="background:#241814;color:#fff">Espresso<br>#241814</span><span style="background:#4b2e23;color:#fff">Nâu rang<br>#4B2E23</span><span style="background:#c58b52;color:#241814">Caramel<br>#C58B52</span><span style="background:#f5efe6">Kem sữa<br>#F5EFE6</span></div></div><div class="panel"><h3>Icon nét mảnh · Lucide</h3><div class="iconset"><span><i data-lucide="coffee"></i> Bán hàng</span><span><i data-lucide="warehouse"></i> Kho</span><span><i data-lucide="users"></i> Khách</span><span><i data-lucide="receipt"></i> Hóa đơn</span><span><i data-lucide="wallet"></i> Thu chi</span><span><i data-lucide="chart-column"></i> Báo cáo</span></div></div><div class="panel"><h3>Hành động</h3><div class="row" style="margin-top:14px"><button class="primary" data-note="Đã lưu dữ liệu minh họa">Lưu thay đổi</button><button data-note="Đã quay lại">Quay lại</button><button disabled>Không khả dụng</button><button style="color:#b42318" data-note="Thao tác hủy cần hộp thoại xác nhận">Hủy hóa đơn</button></div></div><div class="panel samplefields"><label>Tên sản phẩm *<input value="Cà phê sữa"></label><label>Danh mục<select><option>Cà phê</option><option>Trà</option></select></label><label>Giá bán *<input value="30.000 ₫"></label><label>Số điện thoại<input placeholder="Nhập số điện thoại" aria-invalid="true"><span class="error">Số điện thoại chưa đúng định dạng.</span></label></div><div class="notice">Dữ liệu đã thay đổi ở phiên khác. Tải lại trước khi tiếp tục.</div><div class="panel"><h3>Xác nhận thanh toán</h3><p>Thanh toán hóa đơn HD…001 với số tiền 95.000 ₫?</p><span class="caption">Sau khi hoàn tất không thể sửa tiền hoặc món.</span><div class="row" style="margin-top:16px"><button data-note="Đã quay lại">Quay lại</button><button class="primary" data-note="Đây là bản xem thử, chưa thực hiện thanh toán">Xác nhận thanh toán</button></div></div><div class="feedback" aria-live="polite"></div></div></section></main></div>`;
const screens=app.querySelectorAll('[data-screen]');app.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{screens.forEach(s=>s.hidden=s.dataset.screen!==b.dataset.view);app.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('selected',n===b))}));
const feedback=msg=>app.querySelectorAll('.feedback').forEach(f=>f.textContent=msg);app.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>feedback(b.dataset.note));app.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-table]').forEach(n=>n.classList.toggle('selected',n===b));app.querySelector('.heading .badge').textContent='Bàn '+b.dataset.table+' · Đơn mẫu';app.querySelector('aside h3').textContent='Đơn bàn '+b.dataset.table;feedback('Đang xem bố cục đơn mẫu của bàn '+b.dataset.table)});
app.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{let p=products[Number(b.dataset.product)];total+=p[1];const line=document.createElement('div');line.className='orderline';line.innerHTML='<span>'+p[0]+' <span class="caption">× 1</span></span><span>'+money(p[1])+'</span>';app.querySelector('.lines').appendChild(line);app.querySelector('.subtotal').textContent=money(total);app.querySelector('.amount').textContent=money(total);feedback('Đã thêm '+p[0]+' vào đơn mẫu')});app.querySelector('.search').oninput=e=>app.querySelectorAll('[data-product]').forEach(b=>b.hidden=!products[Number(b.dataset.product)][0].toLocaleLowerCase('vi').includes(e.target.value.toLocaleLowerCase('vi')));app.querySelector('.checkout').onclick=()=>app.querySelector('.pay').hidden=false;app.querySelector('.cancel').onclick=()=>app.querySelector('.pay').hidden=true;app.querySelector('.confirm').onclick=()=>{app.querySelector('.pay').hidden=true;feedback('Mô phỏng thành công · '+money(total)+' · Có thể in hóa đơn')};
});if(globalThis.lucide) lucide.createIcons({attrs:{width:18,height:18}});})();
</script>
</body></html>
